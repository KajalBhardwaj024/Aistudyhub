{% extends "base.html" %}

{% block content %}

<h2>📄 Upload Notes</h2>

<form id="uploadForm"
method="POST"
enctype="multipart/form-data">

<input
type="file"
name="note"
required>

<br><br>

<button
type="submit">

Upload

</button>

</form>

<br>

<div id="loading"
style="display:none">

⏳ Extracting text...

</div>


{% if subject %}

<hr>

<h3>

📚 Detected Subject:
{{subject}}

</h3>

<h3>

📄 Extracted Text Preview

</h3>

<div style="
background:#f5f5f5;
padding:15px;
border-radius:10px;
height:250px;
overflow:auto;
">

{{extracted_text}}

</div>

<br><br>

<a href="/quiz">

<button>

📝 Generate Quiz

</button>

</a>


{% endif %}


<script>

document.getElementById(
"uploadForm"
).onsubmit=function(){

document.getElementById(
"loading"
).style.display="block";

};

</script>

{% endblock %}
