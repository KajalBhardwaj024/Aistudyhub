{% extends "base.html" %}

{% block content %}
<!DOCTYPE html>
<html>

<head>

<title>Analytics Dashboard</title>

<style>

body{
font-family:Arial;
background:#f0f2f5;
}

.container{
width:70%;
margin:auto;
text-align:center;
}

.card{

background:white;
padding:20px;
margin:20px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

</style>

</head>

<body>

<div class="container">

<h1>📊 Performance Analytics</h1>

<div class="card">
<h2>Total Quizzes Attempted</h2>
<h3>{{total_quizzes}}</h3>
</div>

<div class="card">
<h2>Total Score</h2>
<h3>{{total_score}}</h3>
</div>

<div class="card">
<h2>Average Score</h2>
<h3>{{average_score}}</h3>
</div>

</div>

</body>

</html>
{% endblock %}
