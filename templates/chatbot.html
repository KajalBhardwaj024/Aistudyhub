<!DOCTYPE html>
<html>

<head>

<title>AI Chatbot</title>

<style>

body{
font-family:Arial;
background:#f0f2f5;
}

.container{
width:500px;
margin:100px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
text-align:center;
}

input{
width:90%;
padding:10px;
}

button{
padding:10px;
background:#4CAF50;
color:white;
border:none;
border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>🤖 AI Study Chatbot</h2>

<form method="POST">

<input
type="text"
name="question"
placeholder="Ask a question..."
required>

<br><br>

<button type="submit">
Ask
</button>

</form>

<br>

<h3>Answer:</h3>

<p>{{answer}}</p>

</div>

</body>

</html>
