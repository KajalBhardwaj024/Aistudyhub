{% extends "base.html" %}

{% block content %}

<div class="container">

<h2>

🏆 {{subject}} Leaderboard

</h2>

<table>

<tr>

<th>
Rank
</th>

<th>
Student
</th>

<th>
Score
</th>

</tr>

{% for student in leaderboard %}

<tr>

<td>

{{loop.index}}

</td>

<td>

{{student.email}}

</td>

<td>

{{student.score}}

</td>

</tr>

{% endfor %}

</table>

</div>

<style>

.container{

width:700px;

margin:auto;

background:white;

padding:20px;

border-radius:10px;

box-shadow:0px 0px 10px gray;

}

table{

width:100%;

border-collapse:collapse;

}

th,td{

padding:12px;

border:1px solid #ddd;

text-align:center;

}

th{

background:#4CAF50;

color:white;

}

tr:nth-child(even){

background:#f2f2f2;

}

</style>

{% endblock %}
