{% extends "base.html" %}

{% block content %}
<!DOCTYPE html>
<html>

<head>

<title>Performance Prediction</title>

<style>

body{
font-family:Arial;
background:#f0f2f5;
}

.container{

width:500px;
margin:80px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
text-align:center;

}

input{

width:90%;
padding:10px;
margin:10px;

}

button{

background-color:#4CAF50;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;

}

button:hover{

background-color:green;

}

.result{

margin-top:20px;
padding:10px;
background:#f5f5f5;
border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<h1>📈 Student Performance Prediction</h1>

<form method="POST">

<input
type="number"
name="math"
placeholder="Math Score"
required>

<input
type="number"
name="reading"
placeholder="Reading Score"
required>

<input
type="number"
name="writing"
placeholder="Writing Score"
required>

<br><br>

<button type="submit">

Predict

</button>

</form>

<div class="result">

<h3>Performance:</h3>

<p>{{result}}</p>

<h3>Recommended Course:</h3>

<p>{{recommendation}}</p>

</div>

</div>

</body>

</html>
{% endblock %}
