<!DOCTYPE html>
<html>
<head>
<title>AI StudyHub Signup</title>

<style>

body{
background-color:#f0f2f5;
font-family:Arial;
}

.container{
width:350px;
margin:100px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
background-color:#4CAF50;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background-color:green;
}

a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>AI StudyHub</h1>
<h3>Create Account</h3>

<form method="POST">

<input type="email"
name="email"
placeholder="Enter Email"
required>

<input type="password"
name="password"
placeholder="Create Password"
required>

<br><br>

<button type="submit">
Signup
</button>

</form>

<br>

<a href="/">
Already have an account? Login
</a>

</div>

</body>
</html>
